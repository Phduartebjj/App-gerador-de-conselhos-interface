<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/images/favIcons/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Manrope:wght@200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="src/css/variables.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="src/css/responsive.css" />
    <title>Advice generator</title>
  </head>
  <body>
    <header class="header">
      <nav class="nav-bar">
        <h1>Advice Generator</h1>

        <input type="checkbox" name="" class="menu-toggle" id="menu-toggle" />
        <label for="menu-toggle" class="menu-icon"
          ><img src="src/images/ui/ícone.svg" alt="menu mobile"
        /></label>

        <nav class="nav-menu">
          <ul>
            <li>
              <button type="button" value="pt-br" class="button idiomaBrasi">
                <img
                  src="src/images/icons/bandeira-brasil.svg"
                  alt="Bandeira do Brasil"
                />
              </button>
            </li>
            <li>
              <button type="button" value="es" class="button idiomaBrasi">
                <img
                  src="src/images/icons/bandeira-espanha.svg"
                  alt="Bandeira da Espanha"
                />
              </button>
            </li>
          </ul>
        </nav>
      </nav>
    </header>

    <main class="main">
      <div class="card-conselho">
        <h2>ADVICE #117</h2>
        <p>Clique no botão para gerar o seu conselho</p>
        <picture>
          <source
            media="(max-width: 425px)"
            srcset="src/images/ui/pattern-divider-mobile.svg"
          />
          <img src="src/images/ui/pattern-divider-desktop.svg" alt="divider" />
        </picture>
        <button class="button btn-conselho"></button>
      </div>
    </main>
    <script type="module" src="src/js/script.js"></script>
  </body>
</html>
