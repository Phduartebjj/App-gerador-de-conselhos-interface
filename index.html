<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/images/favIcons/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Manrope:wght@200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="src/css/variables.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="src/css/responsive.css" />
    <title>Advice generator</title>
  </head>
  <body>
    <header class="header">
      <h1>Advice Generator</h1>
      <nav class="nav-bar">
        <button type="button" value="pt-br">
          <img
            src="src/images/icons/bandeira-brasil.svg"
            alt="Bandeira do Brasil"
          />
        </button>
        <button type="button" value="es">
          <img
            src="src/images/icons/bandeira-brasil.svg"
            alt="Bandeira da Espanha"
          />
        </button>
      </nav>
    </header>

    <main class="main">
      <div class="card-conselho">
        <h2>ADVICE #117</h2>
        <p>Clique no botão para gerar o seu conselho</p>
        <picture>
          <source
            media="(max-width: 425px)"
            srcset="src/images/ui/pattern-divider-mobile.svg"
          />
          <img src="src/images/ui/pattern-divider-desktop.svg" alt="divider" />
        </picture>
        <button class="btn-conselho">
          <img
            src="src/images/ui/icon-dice.svg"
            alt="botão de gerar conselho"
          />
        </button>
      </div>
    </main>
    <script type="module" src="src/js/script.js"></script>
  </body>
</html>
